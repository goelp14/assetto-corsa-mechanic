<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #0f1117; color: #e8eaed; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  .sub { color: #9aa0a6; margin-bottom: 20px; }
  .layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  svg { width: 100%; height: auto; background: #1a1d27; border: 1px solid #333; border-radius: 8px; }
  .track { fill: none; stroke: #5b8def; stroke-width: 4; stroke-linecap: round; }
  .panel { background: #1a1d27; border: 1px solid #333; border-radius: 8px; padding: 16px; }
  .panel h2 { margin: 0 0 12px; font-size: 1.1rem; }
  .corner-btn { display: block; width: 100%; text-align: left; background: #252836; border: 1px solid #333; color: #e8eaed; padding: 10px 12px; margin-bottom: 8px; border-radius: 6px; cursor: pointer; }
  .corner-btn:hover, .corner-btn.active { border-color: #5b8def; background: #2a3148; }
  .corner-btn .num { color: #5b8def; font-weight: 700; margin-right: 8px; }
  .detail { margin-top: 16px; padding-top: 16px; border-top: 1px solid #333; }
  .detail .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 8px; }
  .detail p { margin: 8px 0; line-height: 1.5; color: #c4c7cc; font-size: 14px; }
  .detail strong { color: #e8eaed; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 20px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #333; }
  th { color: #9aa0a6; }
  .loss { color: #ef4444; }
  .gain { color: #22c55e; }
</style>

<script>
const CORNERS = [{"order": 1, "name": "Sainte Devote", "internal": "Turn 1", "map": "Bottom-left of the map \u2014 first right off the start straight", "fix": "Short climb on full throttle toward Beau Rivage", "issue": "Improving", "color": "#22c55e", "delta": -0.15, "nx": 64.1, "ny": 337.7}, {"order": 2, "name": "Casino", "internal": "Turn 4", "map": "Top-left sweep past the casino hairpin area", "fix": "Feed throttle once the front bites toward Mirabeau", "issue": "Power while turning", "color": "#eab308", "delta": 0.12, "nx": 430.0, "ny": 405.9}, {"order": 3, "name": "Hairpin", "internal": "Turn 6", "map": "Tightest loop on the left side of the map", "fix": "Patience on throttle until the car is straight for Portier", "issue": "Brake earlier", "color": "#eab308", "delta": -0.38, "nx": 639.9, "ny": 562.0}, {"order": 4, "name": "Tunnel exit chicane", "internal": "Turn 8", "map": "Right-hand kink where the long bottom curve meets the harbour", "fix": "Flat through Tabac approach once the rear settles", "issue": "Understeer sometimes", "color": "#94a3b8", "delta": -0.2, "nx": 848.7, "ny": 567.7}, {"order": 5, "name": "Swimming Pool", "internal": "Swimming Pool", "map": "Top-right double wiggle \u2014 two quick left-right kinks", "fix": "Short harbour straight; the tight right hook of Rascasse is next", "issue": "Steer corrections", "color": "#94a3b8", "delta": -0.74, "nx": 492.5, "ny": 387.2}, {"order": 6, "name": "Tabac", "internal": "Tabac", "map": "Fast left kink between the harbour straight and the pool chicanes", "fix": "Open throttle toward the first Swimming Pool board", "issue": "Early throttle", "color": "#eab308", "delta": 0.15, "nx": 335.2, "ny": 370.0}, {"order": 7, "name": "Rascasse", "internal": "Rascasse", "map": "Sharp right hook after the pool wiggle \u2014 pit-entry notch on the inside", "fix": "Throttle once the car points at the short straight to the final corner", "issue": "Stay on rubber", "color": "#94a3b8", "delta": 0.06, "nx": 133.1, "ny": 351.8}, {"order": 8, "name": "Anthony Noghes", "internal": "Final Corner", "map": "Last sharp right before the bottom start straight on the map", "fix": "Full throttle once the steering unwinds toward Sainte Devote", "issue": "FIX FIRST: steer sawing", "color": "#ef4444", "delta": 0.87, "nx": 142.2, "ny": 241.3}];
const detail = document.getElementById('detail');
const buttons = document.getElementById('buttons');
const rows = document.getElementById('rows');
let active = CORNERS.find(c => c.internal === 'Final Corner') || CORNERS[0];

function fmtDelta(d) {
  if (d > 0.05) return '<span class="loss">+' + d.toFixed(2) + 's</span>';
  if (d < -0.05) return '<span class="gain">' + d.toFixed(2) + 's</span>';
  return d.toFixed(2) + 's';
}

function show(c) {
  active = c;
  document.querySelectorAll('.corner-btn').forEach(b => b.classList.toggle('active', b.dataset.id === c.internal));
  detail.innerHTML = '<span class="tag" style="background:' + c.color + '33;color:' + c.color + '">' + c.issue + '</span>'
    + '<h2 style="margin:4px 0 8px">' + c.order + '. ' + c.name + '</h2>'
    + '<p><strong>Where:</strong> ' + c.map + '</p>'
    + '<p><strong>Fix:</strong> ' + c.fix + '</p>'
    + '<p><strong>Time vs your ref:</strong> ' + fmtDelta(c.delta) + '</p>';
}

CORNERS.forEach(c => {
  const btn = document.createElement('button');
  btn.className = 'corner-btn';
  btn.dataset.id = c.internal;
  btn.innerHTML = '<span class="num">' + c.order + '</span>' + c.name + ' ' + fmtDelta(c.delta);
  btn.onclick = () => show(c);
  buttons.appendChild(btn);
  const tr = document.createElement('tr');
  tr.innerHTML = '<td>' + c.order + '</td><td>' + c.name + '</td><td>' + c.internal + '</td><td>' + c.map + '</td><td>' + fmtDelta(c.delta) + '</td>';
  rows.appendChild(tr);
  document.querySelector('.marker[data-id="' + c.internal + '"]').addEventListener('click', () => show(c));
});
show(active);
</script>
</body>
</html>
