name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: replay-viewer/package-lock.json

      - name: Install test dependencies
        run: pip install "pytest>=7.0"

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build Content Manager zip
        run: ./deploy/package.sh

      - name: Build replay viewer
        working-directory: replay-viewer
        run: |
          npm ci
          npm run build

      - name: Package replay viewer dist
        run: |
          mkdir -p dist
          (cd replay-viewer/dist && zip -rq "../../dist/replay-viewer-dist.zip" .)

      - name: Write checksums
        run: |
          cd dist
          sha256sum VirtualRaceEngineer.zip replay-viewer-dist.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/VirtualRaceEngineer.zip
            dist/replay-viewer-dist.zip
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
